name: Publish to PyPI

# Fires when you publish a GitHub Release (tag it e.g. v1.0.0 first).
# Uses PyPI's Trusted Publishing (OIDC) - no API token stored in this repo.
# One-time setup on PyPI's side: on the project's PyPI page, go to
# "Publishing" -> "Add a new publisher" and register:
#   Owner: rexackermann   Repository: termigma
#   Workflow: publish.yml   Environment: pypi
# (If the project doesn't exist on PyPI yet, PyPI lets you pre-register a
# trusted publisher for a not-yet-published project name from your account.)

on:
  release:
    types: [published]
  workflow_dispatch: {}  # lets you trigger a publish manually if needed

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # required for trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
